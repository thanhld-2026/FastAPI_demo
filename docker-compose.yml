# Chạy toàn bộ hệ thống:   docker compose up -d --build
# Chỉ chạy hạ tầng (để dev app ở máy local):   docker compose up -d db redis mailpit
#
# Các biến ${...} được đọc từ file .env cùng thư mục (giá trị sau :- là mặc định).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskhub}
      POSTGRES_DB: ${POSTGRES_DB:-taskhub}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # dữ liệu không mất khi xóa container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP server giả lập để test email: mọi mail gửi tới đều hiện ở web UI http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # `environment` ghi đè giá trị trong .env: trong mạng docker, các service gọi nhau
    # bằng TÊN SERVICE (db, redis, mailpit) chứ không phải localhost.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskhub}:${POSTGRES_PASSWORD:-taskhub}@db:5432/${POSTGRES_DB:-taskhub}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs # xem file log ngay trên máy host
    depends_on:
      db:
        condition: service_healthy # chờ Postgres sẵn sàng rồi mới chạy migration
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
